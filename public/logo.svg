<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Audio mark -->
  <rect x="4" y="8" width="32" height="32" rx="8" fill="#151614"/>
  <!-- Soundwaves with theme colors -->
  <line x1="12" y1="24" x2="12" y2="24" stroke="#D8A2A2" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="18" x2="16" y2="30" stroke="#8EA66B" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="13" x2="20" y2="35" stroke="#D8A2A2" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="17" x2="24" y2="31" stroke="#8EA66B" stroke-width="3" stroke-linecap="round"/>
  <line x1="28" y1="21" x2="28" y2="27" stroke="#FFDCDC" stroke-width="3" stroke-linecap="round"/>

  <!-- Text -->
  <text x="46" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="currentColor" letter-spacing="-0.5">Voice<tspan fill="#D8A2A2">Take</tspan></text>
